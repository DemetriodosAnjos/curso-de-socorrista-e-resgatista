<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Curso de Socorrista Resgatista</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/simulado.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  </head>
  <body>
    <!-- Overlay de Carregamento de PDF -->
    <div
      id="pdf-loading"
      class="pdf-loading-overlay is-hidden"
      aria-live="polite"
      aria-busy="true"
    >
      <div class="pdf-loading-card">
        <div class="pdf-spinner"></div>
        <p class="pdf-loading-text">Gerando visualização do PDF...</p>
      </div>
    </div>
    <!-- Overlay para escurecer o fundo quando a sidebar abrir no mobile -->
    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <div class="app-layout">
      <!-- SIDEBAR POR CIMA (3 BLOCOS VERTICAIS) -->
      <nav class="sidebar" id="sidebar-menu">
        <!-- BLOCO 1: Logo Centralizado -->
        <div class="sidebar-block sidebar-logo-block">
          <img
            src="images/logo/logo-aph-blue.png"
            alt="Logo UNITEC"
            class="sidebar-logo"
          />
        </div>

        <!-- BLOCO 2: Matérias (Menu) -->
        <div class="sidebar-block sidebar-content-block">
          <div class="sidebar-header">
            <h2>Matérias</h2>
            <button
              id="close-sidebar-btn"
              class="close-sidebar-btn"
              aria-label="Fechar menu"
            >
              &times;
            </button>
          </div>
          <ul id="menu-list"></ul>
        </div>

        <!-- BLOCO 3: Divider + Versão Centralizada -->
        <div class="sidebar-block sidebar-footer-block">
          <hr class="sidebar-divider" />
          <span class="sidebar-version">Versão 2.0.26</span>
        </div>
      </nav>

      <!-- ÁREA DIREITA (HEADER + CONTEÚDO) -->
      <div class="main-wrapper">
        <header class="main-header">
          <button
            id="hamburger-btn"
            class="hamburger-btn"
            aria-label="Abrir menu"
          >
            <span></span>
            <span></span>
            <span></span>
          </button>
          <h1>UNITEC - Curso para Socorrista e Resgatista</h1>
        </header>

        <main class="content-area">
          <article id="content-article">
            <h2 id="content-title">Selecione uma matéria no menu lateral</h2>
            <div id="content-body">
              <p>Escolha um módulo para iniciar os estudos.</p>
            </div>
          </article>

          <!-- is-hidden esconde a barra inteira no estado inicial sem quebrar o espaço de JS -->
          <!-- FABs (Floating Action Buttons) -->
          <aside class="fab-container" id="content-actions">
            <!-- 1. Visualizar (Topo) -->
            <button
              id="visualizar"
              class="fab-btn fab-visualizar"
              title="Visualizar PDF"
            >
              <svg
                class="fab-icon"
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="currentColor"
                aria-hidden="true"
              >
                <path
                  d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"
                />
              </svg>
            </button>

            <!-- 2. Download (Meio) -->
            <button
              id="download-link"
              class="fab-btn fab-download"
              title="Baixar Material (.PDF)"
              hidden
            >
              <svg
                class="fab-icon"
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="currentColor"
                aria-hidden="true"
              >
                <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z" />
              </svg>
            </button>

            <!-- 3. Compartilhar (Base) -->
            <button
              id="share-btn"
              class="fab-btn fab-share"
              title="Compartilhar Lição"
              hidden
            >
              <svg
                class="fab-icon"
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="currentColor"
                aria-hidden="true"
              >
                <path
                  d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"
                />
              </svg>
            </button>
          </aside>

          <footer class="footer-credits">
            <div class="footer-content">
              <div class="credits-info">
                <p>&copy; Todos os direitos reservados</p>
                <p>Criado por: <strong>Demetrio dos Anjos</strong></p>
              </div>

              <div class="social-contacts">
                <span class="social-title">Contato:</span>
                <div class="social-links">
                  <a
                    href="https://www.instagram.com/demetriodosanjos7?igsh=MXFkN3dzOTJhZmE3Yg%3D%3D"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="social-btn instagram"
                    aria-label="Instagram"
                  >
                    <svg
                      xmlns="http://www.w3.org/2000/svg"
                      width="20"
                      height="20"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    >
                      <rect
                        x="2"
                        y="2"
                        width="20"
                        height="20"
                        rx="5"
                        ry="5"
                      ></rect>
                      <path
                        d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"
                      ></path>
                      <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
                    </svg>
                  </a>

                  <a
                    href="https://wa.me/qr/3YKLDKONQ5A7E1"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="social-btn whatsapp"
                    aria-label="WhatsApp"
                  >
                    <svg
                      xmlns="http://www.w3.org/2000/svg"
                      width="20"
                      height="20"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    >
                      <path
                        d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"
                      ></path>
                    </svg>
                  </a>
                </div>
              </div>
            </div>
          </footer>
        </main>
      </div>
    </div>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
