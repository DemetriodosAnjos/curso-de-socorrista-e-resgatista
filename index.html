<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Curso de Socorrista Resgatista</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  </head>
  <body>
    <header class="main-header">
      <h1>UNITEC - Curso para Socorrista e Resgatista</h1>
      <!-- Botão Hambúrguer (pode colocar no seu Header ou logo no topo do Container) -->
      <button id="hamburger-btn" class="hamburger-btn" aria-label="Abrir menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </header>

    <!-- Overlay para escurecer o fundo quando a sidebar abrir -->
    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <div class="container">
      <nav class="sidebar" id="sidebar-menu">
        <!-- Opcional: botão de fechar dentro do menu mobile -->
        <div class="sidebar-header">
          <h2>Matérias</h2>
          <button
            id="close-sidebar-btn"
            class="close-sidebar-btn"
            aria-label="Fechar menu"
          >
            &times;
          </button>
        </div>
        <ul id="menu-list"></ul>
      </nav>

      <main class="content-area">
        <article id="content-article">
          <h2 id="content-title">Selecione uma matéria no menu lateral</h2>
          <div id="content-body">
            <p>Escolha um módulo para iniciar os estudos.</p>
          </div>
        </article>

        <footer class="content-actions">
          <button id="visualizar" class="btn btn-visualizar">
            <span>👁️</span> Visualizar PDF
          </button>

          <a href="#" id="download-link" class="btn btn-download" hidden>
            <span>📥</span> Baixar Material (.PDF)
          </a>

          <button id="share-btn" class="btn btn-share" hidden>
            <span>🪶</span> Compartilhar Lição
          </button>
        </footer>

        <!-- Nova Div de Créditos e Redes Sociais -->
        <div class="footer-credits">
          <div class="credits-info">
            <p>&copy; Todos os direitos reservados</p>
            <p>Criado por: <strong>Demetrio dos Anjos</strong></p>
          </div>

          <div class="social-contacts">
            <span class="social-title">Contato:</span>
            <div class="social-links">
              <a
                href="https://www.instagram.com/demetriodosanjos7?igsh=MXFkN3dzOTJhZmE3Yg%3D%3D"
                target="_blank"
                rel="noopener noreferrer"
                class="social-btn instagram"
                aria-label="Instagram"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
                  <path
                    d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"
                  ></path>
                  <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
                </svg>
              </a>

              <a
                href="https://wa.me/qr/3YKLDKONQ5A7E1"
                target="_blank"
                rel="noopener noreferrer"
                class="social-btn whatsapp"
                aria-label="WhatsApp"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path
                    d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"
                  ></path>
                </svg>
              </a>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
